apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-db-init
  namespace: formatec-bank
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS accounts (
      id integer PRIMARY KEY,
      holder text NOT NULL,
      balance numeric(14,2) NOT NULL CHECK (balance >= 0)
    );

    CREATE TABLE IF NOT EXISTS transfers (
      id bigserial PRIMARY KEY,
      idempotency_key text NOT NULL UNIQUE,
      from_id integer NOT NULL REFERENCES accounts(id),
      to_id integer NOT NULL REFERENCES accounts(id),
      amount numeric(14,2) NOT NULL CHECK (amount > 0),
      created_at timestamptz NOT NULL DEFAULT now()
    );

    INSERT INTO accounts (id, holder, balance) VALUES
      (1, 'Cuenta demo principal', 125000.00),
      (2, 'Cuenta demo destino', 38000.00)
    ON CONFLICT (id) DO NOTHING;
---
apiVersion: v1
kind: Service
metadata:
  name: bank-db
  namespace: formatec-bank
spec:
  selector:
    app: bank-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bank-db
  namespace: formatec-bank
spec:
  serviceName: bank-db
  replicas: 1
  selector:
    matchLabels:
      app: bank-db
  template:
    metadata:
      labels:
        app: bank-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: bank
            - name: POSTGRES_USER
              value: bank
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bank-lab-secrets
                  key: db-password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U bank -d bank"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: bank-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
